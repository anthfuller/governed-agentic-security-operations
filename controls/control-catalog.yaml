  - id: GASO-AUD-002
    title: Detect audit-chain tampering
    purpose: Detect deletion, reordering, or modification of recorded events.
    requirement: Ordered audit fixtures MUST use the documented SHA-256 hash-chain construction and verify without gaps.
    profiles: [MSSP, MDR, DFIR]
    accountable_role: Audit owner
    required_inputs: [ordered audit event set]
    expected_evidence: [audit-chain verification result]
    failure_behavior: fail_closed
    verification: [{type: automated, method: Recompute event hashes and previous-hash links for every event.}]

artifact_type: control_catalog
catalog_version: 0.1.0
controls:
  - id: GASO-GOV-001
    title: Separate recommendation from authorization
    purpose: Prevent an agent or assurance component from granting its own authority.
    requirement: A recommendation, judge result, or model output MUST NOT authorize an external action.
    profiles: [MSSP, MDR, DFIR]
    accountable_role: Governance owner
    required_inputs: [agent card, policy decision record]
    expected_evidence: [recorded authorization source, separation-of-duties review]
    failure_behavior: deny
    verification: [{type: automated, method: Reject decisions whose authorizer is an agent or judge.}]
    related: {documents: [architecture/control-loop.md], templates: [templates/agent-card-template.md, templates/policy-decision-record-template.md], schemas: [], walkthroughs: [], tests: [tests/test_policy.py]}
    external_dependencies: []
  - id: GASO-GOV-002
    title: Assign accountable ownership
    purpose: Ensure each governed component and decision has a named accountable role.
    requirement: Agents, policies, tools, releases, approvals, and exceptions MUST identify an accountable role.
    profiles: [MSSP, MDR, DFIR]
    accountable_role: Governance owner
    required_inputs: [agent card, tool contract, implementation profile]
    expected_evidence: [ownership record, review record]
    failure_behavior: fail_closed
    verification: [{type: automated, method: Validate required ownership fields and non-agent role values.}]
    related: {documents: [agent-governance/readme.md], templates: [templates/agent-card-template.md, templates/tool-contract-template.md], schemas: [], walkthroughs: [], tests: [tests/test_catalog.py]}
    external_dependencies: []
  - id: GASO-GOV-003
    title: Govern material changes
    purpose: Prevent unreviewed changes to governed behavior and authority.
    requirement: Material changes MUST be versioned, reviewed, approved at the required level, and reversible.
    profiles: [MSSP, MDR, DFIR]
    accountable_role: Change authority
    required_inputs: [change record, validation results, rollback plan]
    expected_evidence: [approval record, version record, rollback test]
    failure_behavior: fail_closed
    verification: [{type: manual, method: Confirm approval and rollback evidence before release.}]
    related: {documents: [agent-governance/agent-change-management.md], templates: [templates/adr-template.md], schemas: [], walkthroughs: [], tests: [tests/test_controls.py]}
    external_dependencies: [organization change-management system]

  - id: GASO-IDN-001
    title: Use distinct governed identities
    purpose: Make agent and service activity attributable and revocable.
    requirement: Each active agent or service identity MUST be distinct, attributable, and lifecycle managed.
    profiles: [MSSP, MDR, DFIR]
    accountable_role: Identity owner
    required_inputs: [agent identity record, owner record]
    expected_evidence: [identity identifier, lifecycle state, credential reference]
    failure_behavior: fail_closed
    verification: [{type: manual, method: Verify identity uniqueness and ownership in the external identity system.}]
    related: {documents: [agent-governance/agent-identity-lifecycle.md], templates: [templates/agent-card-template.md], schemas: [], walkthroughs: [], tests: [tests/test_controls.py]}
    external_dependencies: [organization identity provider]
  - id: GASO-IDN-002
    title: Enforce least privilege
    purpose: Limit available authority to the current mission and scope.
    requirement: Identity and tool permissions MUST be limited to approved operations and scope.
    profiles: [MSSP, MDR, DFIR]
    accountable_role: Identity owner
    required_inputs: [approved scope, permission record]
    expected_evidence: [permission review, scope match result]
    failure_behavior: deny
    verification: [{type: external, method: Compare effective permissions with the approved tool contract.}]
    related: {documents: [agent-governance/agent-access-scope.md, tool-access/tool-access-model.md], templates: [templates/tool-contract-template.md], schemas: [], walkthroughs: [], tests: [tests/test_scope.py]}
    external_dependencies: [organization identity provider, target platform authorization]
  - id: GASO-IDN-003
    title: Revoke inactive or compromised identities
    purpose: Stop use of identities that are expired, suspended, or compromised.
    requirement: Suspended, expired, recalled, or compromised identities MUST be denied and their credentials revoked externally.
    profiles: [MSSP, MDR, DFIR]
    accountable_role: Identity owner
    required_inputs: [identity state, revocation trigger]
    expected_evidence: [revocation record, denied-use audit event]
    failure_behavior: deny
    verification: [{type: external, method: Verify revocation and denied access in the identity provider.}]
    related: {documents: [agent-governance/agent-identity-lifecycle.md], templates: [templates/audit-event-template.md], schemas: [], walkthroughs: [], tests: [tests/test_controls.py]}
    external_dependencies: [organization identity provider]

  - id: GASO-TEN-001
    title: Bind every artifact to explicit scope
    purpose: Prevent ambiguous tenant, customer, case, or evidence context.
    requirement: Governed requests and records MUST carry all applicable scope identifiers.
    profiles: [MSSP, MDR, DFIR]
    accountable_role: Service owner
    required_inputs: [tenant identifier, customer identifier, case identifier]
    expected_evidence: [scope validation result]
    failure_behavior: fail_closed
    verification: [{type: automated, method: Require and validate applicable scope identifiers.}]
    related: {documents: [tenant-isolation/tenant-boundary-model.md], templates: [templates/audit-event-template.md], schemas: [], walkthroughs: [], tests: [tests/test_scope.py]}
    external_dependencies: []
  - id: GASO-TEN-002
    title: Preserve scope across handoffs
    purpose: Keep scope unchanged through retrieval, policy, approval, and tool requests.
    requirement: Scope identifiers MUST remain consistent across every correlated artifact and handoff.
    profiles: [MSSP, MDR, DFIR]
    accountable_role: Workflow owner
    required_inputs: [correlated artifact set]
    expected_evidence: [cross-artifact scope validation result]
    failure_behavior: fail_closed
    verification: [{type: automated, method: Compare scope values across artifacts sharing a correlation identifier.}]
    related: {documents: [tenant-isolation/tenant-scope-validation.md], templates: [templates/audit-event-template.md], schemas: [], walkthroughs: [], tests: [tests/test_scope.py]}
    external_dependencies: []
  - id: GASO-TEN-003
    title: Deny cross-scope access by default
    purpose: Block unauthorized cross-tenant, cross-customer, cross-case, and cross-evidence activity.
    requirement: Any unresolved cross-scope mismatch MUST be denied and recorded.
    profiles: [MSSP, MDR, DFIR]
    accountable_role: Security owner
    required_inputs: [requested scope, authorized scope]
    expected_evidence: [denial record, mismatch details]
    failure_behavior: deny
    verification: [{type: automated, method: Inject mismatched scope fixtures and require denial.}]
    related: {documents: [tenant-isolation/cross-tenant-failure-modes.md], templates: [templates/audit-event-template.md], schemas: [], walkthroughs: [], tests: [tests/test_scope.py]}
    external_dependencies: [target data and action platforms]

  - id: GASO-POL-001
    title: Require a policy decision
    purpose: Ensure governed requests are evaluated before an action or release.
    requirement: A valid, current policy decision MUST precede any governed action or release request.
    profiles: [MSSP, MDR, DFIR]
    accountable_role: Policy owner
    required_inputs: [request record, policy version, scope context]
    expected_evidence: [policy decision record]
    failure_behavior: deny
    verification: [{type: automated, method: Reject requests without a valid matching policy decision.}]
    related: {documents: [policy-enforcement/policy-decision-flow.md], templates: [templates/policy-decision-record-template.md], schemas: [], walkthroughs: [], tests: [tests/test_policy.py]}
    external_dependencies: [production policy decision point when deployed]
  - id: GASO-POL-002
    title: Fail closed on indeterminate policy state
    purpose: Prevent ambiguous policy inputs from becoming implied authorization.
    requirement: Missing, invalid, stale, conflicting, or unsupported policy inputs MUST produce FAIL_CLOSED.
    profiles: [MSSP, MDR, DFIR]
    accountable_role: Policy owner
    required_inputs: [policy inputs, policy version]
    expected_evidence: [fail-closed decision and reason codes]
    failure_behavior: fail_closed
    verification: [{type: automated, method: "Run malformed, stale, missing, and conflicting policy fixtures."}]
    related: {documents: [policy-enforcement/fail-closed-behavior.md], templates: [templates/policy-decision-record-template.md], schemas: [], walkthroughs: [], tests: [tests/test_policy.py]}
    external_dependencies: []
  - id: GASO-POL-003
    title: Expire and revalidate decisions
    purpose: Prevent reuse of obsolete authorization context.
    requirement: Policy decisions MUST include validity bounds and MUST be re-evaluated after relevant context changes.
    profiles: [MSSP, MDR, DFIR]
    accountable_role: Policy owner
    required_inputs: [decision timestamp, expiry, current context]
    expected_evidence: [fresh decision or expiration denial]
    failure_behavior: deny
    verification: [{type: automated, method: Reject expired decisions and decisions bound to different context.}]
    related: {documents: [policy-enforcement/policy-contract.md], templates: [templates/policy-decision-record-template.md], schemas: [], walkthroughs: [], tests: [tests/test_policy.py]}
    external_dependencies: []

  - id: GASO-APR-001
    title: Distinguish review from approval
    purpose: Prevent analyst review from being treated as formal authorization.
    requirement: Review records and approval records MUST use distinct types, roles, and outcomes.
    profiles: [MSSP, MDR, DFIR]
    accountable_role: Approval process owner
    required_inputs: [review record, approval policy]
    expected_evidence: [approval record from an authorized role]
    failure_behavior: deny
    verification: [{type: automated, method: Reject review artifacts supplied as authorization.}]
    related: {documents: [human-oversight/human-review-model.md], templates: [templates/human-approval-record-template.md], schemas: [], walkthroughs: [], tests: [tests/test_policy.py]}
    external_dependencies: [organization approval system]
  - id: GASO-APR-002
    title: Bind approval to exact scope
    purpose: Prevent approval reuse for a different action, target, tenant, case, or time window.
    requirement: Approvals MUST bind the approver, action, target, scope, decision, conditions, and validity period.
    profiles: [MSSP, MDR, DFIR]
    accountable_role: Approver
    required_inputs: [approval request, policy decision]
    expected_evidence: [scope-bound approval record]
    failure_behavior: deny
    verification: [{type: automated, method: Reject approval records that do not exactly match the request scope.}]
    related: {documents: [human-oversight/approval-boundaries.md], templates: [templates/human-approval-record-template.md], schemas: [], walkthroughs: [], tests: [tests/test_policy.py]}
    external_dependencies: []
  - id: GASO-APR-003
    title: Require customer authorization when contracted
    purpose: Preserve the customer's retained authority over sensitive actions.
    requirement: Customer authorization MUST be present when the service agreement or action class requires it.
    profiles: [MSSP, MDR]
    accountable_role: Service delivery owner
    required_inputs: [service agreement rule, requested action]
    expected_evidence: [customer approval record]
    failure_behavior: deny
    verification: [{type: automated, method: Reject customer-impacting fixtures when required customer approval is absent.}]
    related: {documents: [human-oversight/customer-approval-model.md], templates: [templates/customer-approval-record-template.md], schemas: [], walkthroughs: [walkthroughs/mssp-endpoint-isolation.md], tests: [tests/test_policy.py]}
    external_dependencies: [contract and customer authorization channel]

  - id: GASO-TOL-001
    title: Register tools before use
    purpose: Prevent invocation of unknown or ungoverned tools.
    requirement: Every referenced tool and operation MUST exist in an approved, current tool contract.
    profiles: [MSSP, MDR, DFIR]
    accountable_role: Tool owner
    required_inputs: [tool contract, operation identifier]
    expected_evidence: [tool registration and review record]
    failure_behavior: deny
    verification: [{type: automated, method: "Reject unknown tools, operations, and inactive contract versions."}]
    related: {documents: [tool-access/tool-registration-requirements.md], templates: [templates/tool-contract-template.md], schemas: [], walkthroughs: [], tests: [tests/test_policy.py]}
    external_dependencies: [production tool registry when deployed]
  - id: GASO-TOL-002
    title: Enforce decisions at the tool boundary
    purpose: Ensure approved scope cannot be bypassed between policy and execution.
    requirement: A policy enforcement point MUST validate the current decision and approval before external tool execution.
    profiles: [MSSP, MDR, DFIR]
    accountable_role: Enforcement owner
    required_inputs: [tool request, policy decision, required approvals]
    expected_evidence: [PEP validation result, tool receipt]
    failure_behavior: deny
    verification: [{type: external, method: Test the production enforcement point with denied and mismatched requests.}]
    related: {documents: [policy-enforcement/pep-pdp-model.md, tool-access/tool-access-model.md], templates: [templates/tool-contract-template.md], schemas: [], walkthroughs: [], tests: [tests/test_policy.py]}
    external_dependencies: [production policy enforcement point]
  - id: GASO-TOL-003
    title: Constrain tool requests to approved parameters
    purpose: Prevent parameter substitution or expansion after approval.
    requirement: Tool name, operation, target, parameters, and scope MUST match the approved request and tool contract.
    profiles: [MSSP, MDR, DFIR]
    accountable_role: Enforcement owner
    required_inputs: [tool request, approval, tool contract]
    expected_evidence: [parameter comparison result]
    failure_behavior: deny
    verification: [{type: automated, method: "Reject fixtures with altered targets, parameters, or operations."}]
    related: {documents: [tool-access/restricted-tool-patterns.md], templates: [templates/tool-contract-template.md], schemas: [], walkthroughs: [], tests: [tests/test_policy.py]}
    external_dependencies: []

  - id: GASO-EVD-001
    title: Identify and hash evidence references
    purpose: Make referenced evidence objects unambiguous and integrity-checkable.
    requirement: Evidence manifests MUST identify each object and record an approved cryptographic hash and acquisition context.
    profiles: [MSSP, MDR, DFIR]
    accountable_role: Evidence custodian
    required_inputs: [evidence object reference, acquisition metadata]
    expected_evidence: [evidence manifest]
    failure_behavior: fail_closed
    verification: [{type: automated, method: "Validate evidence identifiers, hash algorithms, hash values, and required context."}]

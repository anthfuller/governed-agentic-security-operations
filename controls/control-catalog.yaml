    requirement: Every active fleet release MUST have a tested rollback target and an authorized recall path.
    profiles: [MSSP, MDR]
    accountable_role: Fleet owner
    required_inputs: [rollback target, recall criteria, authorization rules]
    expected_evidence: [rollback test, recall record, affected scope]
    failure_behavior: fail_closed

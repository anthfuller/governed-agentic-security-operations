    external_dependencies: [production immutable or tamper-evident audit service]
  - id: GASO-AUD-003
    title: Replay without re-execution
    purpose: Review recorded decisions without repeating agent, policy, or tool behavior.
    requirement: Replay MUST reconstruct recorded state transitions and MUST NOT invoke agents, models, policies, or tools.
    profiles: [MSSP, MDR, DFIR]
    accountable_role: Audit owner
    required_inputs: [verified audit event set]
    expected_evidence: [replay summary]
    failure_behavior: fail_closed
    verification: [{type: automated, method: Produce a deterministic timeline from verified events with no external calls.}]

  - id: GASO-FLT-002
    title: Require eligibility and staged rollout
    purpose: Limit the blast radius of fleet changes.
    requirement: Fleet changes MUST validate tenant eligibility and progress through approved stages with recorded gates.
    profiles: [MSSP, MDR]
    accountable_role: Fleet owner
    required_inputs: [release manifest, tenant eligibility, rollout plan]
    expected_evidence: [stage decisions, monitoring results]
    failure_behavior: fail_closed

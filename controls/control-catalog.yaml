  - id: GASO-EVD-002
    title: Preserve derived-artifact lineage
    purpose: Distinguish transformed or model-assisted outputs from source evidence.
    requirement: Every derived artifact MUST identify its source references, transformation, producer, and integrity value.
    profiles: [MSSP, MDR, DFIR]
    accountable_role: Evidence custodian
    required_inputs: [source references, transformation record]
    expected_evidence: [derived-artifact lineage record]
    failure_behavior: fail_closed
    verification: [{type: automated, method: Resolve every derived artifact to declared source evidence.}]
    related: {documents: [evidence-traceability/evidence-traceability-model.md], templates: [templates/evidence-manifest-template.md], schemas: [], walkthroughs: [], tests: [tests/test_evidence.py]}
    external_dependencies: []
  - id: GASO-EVD-003
    title: Keep summaries separate from original evidence
    purpose: Prevent reports and model outputs from being misrepresented as original evidence.
    requirement: Summaries, findings, timelines, and model outputs MUST be labeled as derived artifacts and MUST NOT replace original evidence references.
    profiles: [MSSP, MDR, DFIR]
    accountable_role: Investigation owner
    required_inputs: [output artifact, source evidence references]
    expected_evidence: [classification and lineage record]
    failure_behavior: fail_closed
    verification: [{type: automated, method: Reject derived artifacts that omit classification or source references.}]
    related: {documents: [evidence-traceability/finding-support-requirements.md], templates: [templates/evidence-manifest-template.md], schemas: [], walkthroughs: [], tests: [tests/test_evidence.py]}
    external_dependencies: []


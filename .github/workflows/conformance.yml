name: Conformance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test schemas, controls, and conformance behavior
        run: pytest
      - name: Validate catalog and profiles
        run: gaso validate controls/control-catalog.yaml profiles/mssp.yaml profiles/mdr.yaml profiles/dfir.yaml --format json
